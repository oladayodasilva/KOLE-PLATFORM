spring:
  application:
    name: kole-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    time-zone: UTC

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  pattern:
    correlation: "[%X{requestId:-no-request-id}] "

  level:
    root: INFO
    com.kole.platform: INFO

kole:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  security:
    jwt:
      issuer: ${JWT_ISSUER:kole-platform}
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}

  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      phone-number: ${BOOTSTRAP_ADMIN_PHONE_NUMBER:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
